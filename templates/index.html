<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Achievement Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d8b4fe, #93c5fd);
            color: #222;
        }

        .header {
            background: linear-gradient(100deg, #54278f, #2563eb);
            color: white;
            text-align: center;
            padding: 35px 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
        }

        .header img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
        }

        .header p {
            font-size: 18px;
            margin-top: 12px;
        }

        .main-container {
            width: 72%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 26px;
            margin-bottom: 26px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .card h2 {
            color: #54278f;
            margin-top: 0;
            border-bottom: 2px solid #d8b4fe;
            padding-bottom: 12px;
            font-size: 27px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #54278f;
        }

        button {
            background: linear-gradient(100deg, #54278f, #2563eb);
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
        }

        button:hover {
            opacity: 0.9;
        }

        .search-box {
            display: flex;
            gap: 12px;
        }

        .search-box input {
            flex: 1;
        }

        .search-box button {
            margin-top: 0;
        }

        @media (max-width: 800px) {
            .main-container {
                width: 92%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 25px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: fit-content;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="{{ url_for('static', filename='trophy.png') }}"
             alt="Trophy Logo">

        <h1>Student Achievement Management System</h1>

        <p>Organize • Manage • Track Student Achievements</p>
    </div>

    <div class="main-container">

        <!-- Add Achievement Section -->
        <div class="card">
            <h2>➕ Add Achievement</h2>

            <form action="/" method="POST">

                <div class="form-grid">

                    <div>
                        <label>Student Name</label>
                        <input type="text"
                               name="student_name"
                               placeholder="Enter student name"
                               required>
                    </div>

                    <div>
                        <label>Achievement Name</label>
                        <input type="text"
                               name="achievement_name"
                               placeholder="Enter achievement"
                               required>
                    </div>

                    <div>
                        <label>Category</label>
                        <input type="text"
                               name="category"
                               placeholder="Academic / Sports / Cultural"
                               required>
                    </div>

                    <div>
                        <label>Year</label>
                        <input type="number"
                               name="achievement_year"
                               placeholder="Enter year"
                               required>
                    </div>

                </div>

                <button type="submit">Add Achievement</button>

            </form>
        </div>

        <!-- Search Achievement Section -->
        <div class="card">
            <h2>🔍 Search Achievement</h2>

            <form action="/search" method="GET">

                <div class="search-box">
                    <input type="text"
                           name="search"
                           placeholder="Search by student, achievement, or category">

                    <button type="submit">Search</button>
                </div>

            </form>
        </div>

    </div>

</body>
</html>
