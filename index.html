<!DOCTYPE html>
<html>
<head>
    <title>Student Achievement Management System</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f3e5f5;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #6a1b9a;
        }

        .box {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            background-color: #6a1b9a;
            color: white;
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message, #records {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Student Achievement Management System</h1>

    <div class="box">

        <h2>Add Achievement</h2>

        <input type="text" id="name" placeholder="Student Name">
        <input type="text" id="achievement" placeholder="Achievement">

        <select id="category">
            <option>Select Category</option>
            <option>Academic</option>
            <option>Sports</option>
            <option>Cultural</option>
            <option>Technical</option>
            <option>Other</option>
        </select>

        <input type="text" id="year" placeholder="Year">

        <br>

        <button onclick="addAchievement()">Add Achievement</button>
        <button onclick="viewAchievements()">View Achievements</button>

        <hr>

        <h2>Search</h2>

        <input type="text" id="search" placeholder="Enter achievement">
        <button onclick="searchAchievement()">Search</button>

        <hr>

        <h2>Edit</h2>

        <input type="text" id="editName" placeholder="Student Name">
        <button onclick="editAchievement()">Edit Achievement</button>

        <hr>

        <h2>Delete</h2>

        <input type="text" id="deleteName" placeholder="Student Name">
        <button onclick="deleteAchievement()">Delete Achievement</button>

        <p id="message"></p>

        <div id="records"></div>

    </div>

    <script>

        let achievements = [];


        function addAchievement() {

            let name = document.getElementById("name").value;
            let achievement = document.getElementById("achievement").value;
            let category = document.getElementById("category").value;
            let year = document.getElementById("year").value;

            if (name == "" || achievement == "" || year == "") {
                document.getElementById("message").innerHTML =
                    "Please fill all the details.";
                return;
            }

            achievements.push({
                name: name,
                achievement: achievement,
                category: category,
                year: year
            });

            document.getElementById("message").innerHTML =
                "Achievement added successfully!";

            document.getElementById("name").value = "";
            document.getElementById("achievement").value = "";
            document.getElementById("year").value = "";
        }


        function viewAchievements() {

            let records = document.getElementById("records");

            if (achievements.length == 0) {
                records.innerHTML = "No achievements found.";
                return;
            }

            records.innerHTML = "<h3>Student Achievements</h3>";

            for (let record of achievements) {

                records.innerHTML +=
                    "Student Name: " + record.name + "<br>" +
                    "Achievement: " + record.achievement + "<br>" +
                    "Category: " + record.category + "<br>" +
                    "Year: " + record.year +
                    "<hr>";
            }
        }


        function searchAchievement() {

            let search =
                document.getElementById("search").value.toLowerCase();

            let records = document.getElementById("records");

            for (let record of achievements) {

                if (record.achievement.toLowerCase().includes(search)) {

                    records.innerHTML =
                        "<h3>Achievement Found!</h3>" +
                        "Student Name: " + record.name + "<br>" +
                        "Achievement: " + record.achievement + "<br>" +
                        "Category: " + record.category + "<br>" +
                        "Year: " + record.year;

                    return;
                }
            }

            records.innerHTML = "Achievement not found.";
        }


        function editAchievement() {

            let name =
                document.getElementById("editName").value;

            for (let record of achievements) {

                if (record.name.toLowerCase() == name.toLowerCase()) {

                    record.achievement =
                        prompt("Enter new achievement:", record.achievement);

                    record.category =
                        prompt("Enter new category:", record.category);

                    record.year =
                        prompt("Enter new year:", record.year);

                    document.getElementById("message").innerHTML =
                        "Achievement updated successfully!";

                    viewAchievements();
                    return;
                }
            }

            document.getElementById("message").innerHTML =
                "Student not found.";
        }


        function deleteAchievement() {

            let name =
                document.getElementById("deleteName").value;

            for (let i = 0; i < achievements.length; i++) {

                if (achievements[i].name.toLowerCase() ==
                    name.toLowerCase()) {

                    achievements.splice(i, 1);

                    document.getElementById("message").innerHTML =
                        "Achievement deleted successfully!";

                    viewAchievements();
                    return;
                }
            }

            document.getElementById("message").innerHTML =
                "Student not found.";
        }

    </script>

</body>
</html>
