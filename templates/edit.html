<!DOCTYPE html>
<html>
<head>
    <title>Edit Achievement</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3e8ff;
            padding: 30px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #bbb;
        }

        h2 {
            text-align: center;
            color: #6a1b9a;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #6a1b9a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #4a148c;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #6a1b9a;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Achievement</h2>

    <form action="/edit/{{ achievement.achievement_id }}" method="POST">

        <label>Student Name</label>
        <input
            type="text"
            name="student_name"
            value="{{ achievement.student_name }}"
            required
        >

        <label>Achievement Name</label>
        <input
            type="text"
            name="achievement_name"
            value="{{ achievement.achievement_name }}"
            required
        >

        <label>Category</label>
        <select name="category" required>
            <option value="">Select Category</option>

            <option value="Academic"
                {% if achievement.category == "Academic" %}selected{% endif %}>
                Academic
            </option>

            <option value="Sports"
                {% if achievement.category == "Sports" %}selected{% endif %}>
                Sports
            </option>

            <option value="Technical"
                {% if achievement.category == "Technical" %}selected{% endif %}>
                Technical
            </option>

            <option value="Cultural"
                {% if achievement.category == "Cultural" %}selected{% endif %}>
                Cultural
            </option>

            <option value="Workshop"
                {% if achievement.category == "Workshop" %}selected{% endif %}>
                Workshop
            </option>
        </select>

        <label>Achievement Year</label>
        <input
            type="number"
            name="achievement_year"
            value="{{ achievement.year }}"
            required
        >

        <button type="submit">Update Achievement</button>

    </form>

    <a href="/">Back to Home</a>

</div>

</body>
</html>
