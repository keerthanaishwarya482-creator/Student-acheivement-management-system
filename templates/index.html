<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Achievement Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #4b0082, #6a5acd);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px auto;
        }

        header h1 {
            margin: 10px 0;
            font-size: 30px;
        }

        header p {
            margin: 0;
            font-size: 17px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #4b0082;
            margin-top: 0;
            border-bottom: 2px solid #ddd;
            padding-bottom: 12px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #6a5acd;
            outline: none;
            box-shadow: 0 0 5px rgba(106, 90, 205, 0.4);
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #4b0082;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6a5acd;
        }

        .search-button {
            background: #008080;
        }

        .search-button:hover {
            background: #006666;
        }

        .info-box {
            background: #f3eaff;
            padding: 15px;
            border-left: 5px solid #4b0082;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #333;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #333;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="{{ url_for('static', filename='trophy.png') }}"
             alt="🏆 Trophy Logo">

        <h1>🏆 Student Achievement Management System</h1>

        <p>✨ Organize • Manage • Track Student Achievements ✨</p>
    </header>

    <div class="container">

        <div class="info-box">
            🎓 Keep all student achievements organized in one place.
        </div>

        <div class="card">
            <h2>➕ Add Achievement</h2>

            <form action="/" method="POST">

                <label for="student_name">👤 Student Name</label>
                <input
                    type="text"
                    id="student_name"
                    name="student_name"
                    placeholder="✍️ Enter student name"
                    required
                >

                <label for="achievement_name">🏅 Achievement Name</label>
                <input
                    type="text"
                    id="achievement_name"
                    name="achievement_name"
                    placeholder="🏆 Enter achievement name"
                    required
                >

                <label for="category">📂 Category</label>
                <select id="category" name="category" required>
                    <option value="">🔽 Select category</option>
                    <option value="Academic">🎓 Academic</option>
                    <option value="Sports">⚽ Sports</option>
                    <option value="Cultural">🎭 Cultural</option>
                    <option value="Technical">💻 Technical</option>
                    <option value="Workshop">📚 Workshop</option>
                    <option value="Seminar">🎤 Seminar</option>
                </select>

                <label for="achievement_year">📅 Year</label>
                <input
                    type="number"
                    id="achievement_year"
                    name="achievement_year"
                    placeholder="📆 Enter achievement year"
                    min="2000"
                    max="2100"
                    required
                >

                <button type="submit">✅ Add Achievement</button>

            </form>
        </div>

        <div class="card">
            <h2>🔍 Search Achievement</h2>

            <form action="/search" method="GET">

                <label for="search">🔎 Search Details</label>
                <input
                    type="text"
                    id="search"
                    name="search"
                    placeholder="👤 Search by student name or achievement"
                >

                <button type="submit" class="search-button">
                    🔍 Search
                </button>

            </form>
        </div>

    </div>

    <footer>
        🏆 Student Achievement Management System
        <br>
        💻 Developed by Ishwarya V
    </footer>

</body>
</html>
