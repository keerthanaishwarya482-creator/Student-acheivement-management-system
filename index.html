<!DOCTYPE html>
<html>
<head>
    <title>Student Achievement Management System</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f3e5f5;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #6a1b9a;
        }

        .box {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            background-color: #6a1b9a;
            color: white;
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Student Achievement Management System</h1>

    <div class="box">

        <h2>Add Achievement</h2>

        <input type="text" id="name" placeholder="Student Name">

        <input type="text" id="achievement" placeholder="Achievement">

        <select id="category">
            <option>Select Category</option>
            <option>Academic</option>
            <option>Sports</option>
            <option>Cultural</option>
            <option>Technical</option>
            <option>Other</option>
        </select>

        <input type="text" id="year" placeholder="Year">

        <br>

        <button onclick="addAchievement()">Add Achievement</button>

        <button onclick="viewAchievements()">View Achievements</button>

        <p id="message"></p>

        <div id="records"></div>

    </div>

    <script>

        let achievements = [];

        function addAchievement() {

            let name = document.getElementById("name").value;
            let achievement = document.getElementById("achievement").value;
            let category = document.getElementById("category").value;
            let year = document.getElementById("year").value;

            if (name == "" || achievement == "" || year == "") {
                document.getElementById("message").innerHTML =
                    "Please fill all the details.";
                return;
            }

            achievements.push({
                name: name,
                achievement: achievement,
                category: category,
                year: year
            });

            document.getElementById("message").innerHTML =
                "Achievement added successfully!";

            document.getElementById("name").value = "";
            document.getElementById("achievement").value = "";
            document.getElementById("year").value = "";
        }


        function viewAchievements() {

            let records = document.getElementById("records");

            if (achievements.length == 0) {
                records.innerHTML = "No achievements found.";
                return;
            }

            records.innerHTML = "<h3>Student Achievements</h3>";

            for (let record of achievements) {

                records.innerHTML +=
                    "Student Name: " + record.name + "<br>" +
                    "Achievement: " + record.achievement + "<br>" +
                    "Category: " + record.category + "<br>" +
                    "Year: " + record.year +
                    "<hr>";
            }
        }

    </script>

</body>
</html>
