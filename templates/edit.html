<!DOCTYPE html>
<html>
<head>
    <title>Edit Achievement</title>
</head>
<body>

    <h1>Edit Achievement</h1>

    <form action="/edit/{{ achievement.achievement_id }}" method="POST">

        <label>Student Name:</label>
        <input type="text" name="student_name"
               value="{{ achievement.student_name }}" required>
        <br><br>

        <label>Achievement Name:</label>
        <input type="text" name="achievement_name"
               value="{{ achievement.achievement_name }}" required>
        <br><br>

        <label>Category:</label>
        <input type="text" name="category"
               value="{{ achievement.category }}" required>
        <br><br>

        <label>Year:</label>
        <input type="number" name="achievement_year"
               value="{{ achievement.achievement_year }}" required>
        <br><br>

        <button type="submit">Update Achievement</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
